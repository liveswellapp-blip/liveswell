workflows:
  ios-testflight-workflow:
    name: LiveSwell iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Must match the name of the API key under Codemagic Team settings >
      # Integrations > Developer Portal (currently named "liveswell").
      app_store_connect: liveswell
    environment:
      vars:
        XCODE_WORKSPACE: "App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.liveswell.app"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: |
          export NODE_ENV=development
          npm install -g npm@latest
          npm --version
          npm install --include=dev --legacy-peer-deps --no-audit --no-fund
          echo "--- Verifying vite installed ---"
          ls -la node_modules/.bin/vite || echo "VITE BINARY MISSING"
          npm ls vite --depth=0 || true
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install
      - name: Build web app
        script: npm run build
      - name: Sync Capacitor iOS project
        script: npx cap sync ios
      - name: Set up keychain to be used for code signing
        script: keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Set up signing certificate
        script: keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Increment build number
        script: |
          cd $CM_BUILD_DIR/ios/App
          agvtool new-version -all $BUILD_NUMBER
      - name: Build ipa for distribution
        script: |
          cd $CM_BUILD_DIR/ios/App
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Uploads the signed build straight to TestFlight once it finishes.
        submit_to_testflight: true
